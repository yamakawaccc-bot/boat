name: history fetch

on:
  workflow_dispatch:
    inputs:
      days:
        description: "遡る日数（最初は7、問題なければ365）"
        required: true
        default: "7"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python history_fetch.py --days ${{ github.event.inputs.days }}
      - name: Commit saved data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update history data"
            git pull --rebase
            git push
          fi
