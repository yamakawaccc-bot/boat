name: build-stats
on:
  workflow_dispatch:
    inputs:
      days:
        description: "集計日数"
        default: "180"
  schedule:
    - cron: "30 20 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Run python build_stats.py
        run: python build_stats.py --days ${{ github.event.inputs.days || 180 }}
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet || git commit -m "update stats"
          git push
